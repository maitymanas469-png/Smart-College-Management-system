<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart College Management System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Notification Banner -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-y-[-120%] opacity-0 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-msg" class="text-sm font-medium">Notification message</span>
  </div>

  <!-- Top Navbar -->
  <header class="bg-brand-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center backdrop-blur">
            <i class="fa-solid fa-graduation-cap text-xl text-indigo-200"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight tracking-wide">Smart College</h1>
            <p class="text-xs text-indigo-200 hidden sm:block">Campus Operations &amp; Academic Management Portal</p>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="flex items-center gap-2">
          <button onclick="resetToDefaultData()" title="Reset sample database" class="text-xs bg-indigo-800/80 hover:bg-indigo-900 text-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-500/30 transition flex items-center gap-1.5">
            <i class="fa-solid fa-rotate"></i>
            <span class="hidden md:inline">Reset Sample Data</span>
          </button>
          <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> DB Connected
          </span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="bg-brand-800/90 border-t border-indigo-600/40 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto flex gap-1 sm:gap-2 overflow-x-auto py-2 scrollbar-none" id="tabs-container">
        <!-- Tab Buttons rendered via JS -->
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full" id="workspace">
    <!-- Active Tab Content dynamically rendered -->
  </main>

  <!-- Global Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all border border-slate-100">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800">Modal Header</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="modal-body" class="p-6">
        <!-- Dynamic content/form -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>Smart College Management System • Educational Full-Stack Architecture</p>
      <p class="font-medium text-slate-600">B.Tech CSE Project • Brainware University</p>
    </div>
  </footer>

  <!-- Application Logic & In-Browser Simulated SQLite Engine -->
  <script>
    // -------------------------------------------------------------
    // Initial Seed Data (Matches schema.sql)
    // -------------------------------------------------------------
    const INITIAL_DB = {
      department: [
        { dept_id: 1, dept_name: "Computer Science" },
        { dept_id: 2, dept_name: "Electronics" },
        { dept_id: 3, dept_name: "Mechanical Engineering" }
      ],
      course: [
        { course_id: 1, course_name: "Database Management Systems", credits: 4, dept_id: 1 },
        { course_id: 2, course_name: "Data Structures & Algorithms", credits: 4, dept_id: 1 },
        { course_id: 3, course_name: "Digital Electronics", credits: 3, dept_id: 2 },
        { course_id: 4, course_name: "Thermodynamics", credits: 3, dept_id: 3 }
      ],
      student: [
        { student_id: 1, roll_no: "CS101", name: "Aarav Sen", email: "aarav@college.edu", year: 1, total_fee: 60000, dept_id: 1 },
        { student_id: 2, roll_no: "CS102", name: "Priya Das", email: "priya@college.edu", year: 2, total_fee: 60000, dept_id: 1 },
        { student_id: 3, roll_no: "EC201", name: "Rahul Roy", email: "rahul@college.edu", year: 3, total_fee: 55000, dept_id: 2 }
      ],
      enrollment: [
        { student_id: 1, course_id: 1 },
        { student_id: 1, course_id: 2 },
        { student_id: 2, course_id: 1 },
        { student_id: 3, course_id: 3 }
      ],
      attendance: [
        { att_id: 1, student_id: 1, course_id: 1, att_date: "2026-11-01", status: "Present" },
        { att_id: 2, student_id: 1, course_id: 2, att_date: "2026-11-01", status: "Present" },
        { att_id: 3, student_id: 2, course_id: 1, att_date: "2026-11-01", status: "Absent" },
        { att_id: 4, student_id: 3, course_id: 3, att_date: "2026-11-01", status: "Present" },
        { att_id: 5, student_id: 1, course_id: 1, att_date: "2026-11-02", status: "Present" },
        { att_id: 6, student_id: 2, course_id: 1, att_date: "2026-11-02", status: "Present" }
      ],
      fee_payment: [
        { pay_id: 1, student_id: 1, amount: 60000, paid_on: "2026-10-15" },
        { pay_id: 2, student_id: 2, amount: 30000, paid_on: "2026-10-20" }
      ]
    };

    // -------------------------------------------------------------
    // Simulated SQLite Database Manager (localStorage Persistent)
    // -------------------------------------------------------------
    class StorageEngine {
      constructor() {
        this.STORAGE_KEY = "SMART_COLLEGE_DB_V1";
        if (!localStorage.getItem(this.STORAGE_KEY)) {
          this.save(INITIAL_DB);
        }
      }

      get() {
        try {
          return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || INITIAL_DB;
        } catch (e) {
          return INITIAL_DB;
        }
      }

      save(data) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
      }

      reset() {
        this.save(INITIAL_DB);
      }

      // Next Auto-Increment ID
      nextId(table, pkField) {
        const db = this.get();
        const rows = db[table] || [];
        if (!rows.length) return 1;
        return Math.max(...rows.map(r => r[pkField] || 0)) + 1;
      }
    }

    const DB = new StorageEngine();

    // -------------------------------------------------------------
    // Navigation & State Management
    // -------------------------------------------------------------
    const tabs = [
      { id: "dashboard", label: "Dashboard", icon: "fa-chart-pie" },
      { id: "students", label: "Students", icon: "fa-user-graduate" },
      { id: "courses", label: "Courses", icon: "fa-book-bookmark" },
      { id: "attendance", label: "Attendance", icon: "fa-clipboard-user" },
      { id: "fees", label: "Fees & Ledger", icon: "fa-receipt" },
      { id: "raw-db", label: "Raw DB Explorer", icon: "fa-database" }
    ];

    let currentTab = "dashboard";

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toast-icon");
      const msg = document.getElementById("toast-msg");

      msg.innerText = message;
      if (isError) {
        icon.className = "fa-solid fa-triangle-exclamation text-rose-400 text-lg";
        toast.className = toast.className.replace(/border-slate-700/g, "border-rose-600");
      } else {
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
        toast.className = toast.className.replace(/border-rose-600/g, "border-slate-700");
      }

      toast.classList.remove("translate-y-[-120%]", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-[-120%]", "opacity-0");
      }, 3000);
    }

    function renderNav() {
      const container = document.getElementById("tabs-container");
      container.innerHTML = tabs.map(t => {
        const isActive = t.id === currentTab;
        return `
          <button onclick="setTab('${t.id}')"
            class="px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition whitespace-nowrap flex items-center gap-2 ${
              isActive 
                ? "bg-white text-brand-700 shadow-sm" 
                : "text-indigo-100 hover:bg-brand-700/70 hover:text-white"
            }">
            <i class="fa-solid ${t.icon}"></i>
            <span>${t.label}</span>
          </button>
        `;
      }).join("");
    }

    function setTab(tabId) {
      currentTab = tabId;
      renderNav();
      renderContent();
    }

    function resetToDefaultData() {
      if (confirm("Reset database to initial sample dataset? Any unsaved edits will be replaced.")) {
        DB.reset();
        showToast("Database refreshed to defaults.");
        renderContent();
      }
    }

    // -------------------------------------------------------------
    // View Renderers
    // -------------------------------------------------------------
    function renderContent() {
      const container = document.getElementById("workspace");
      const db = DB.get();

      if (currentTab === "dashboard") {
        // Analytics
        const totalStudents = db.student.length;
        const totalCourses = db.course.length;
        const collected = db.fee_payment.reduce((sum, p) => sum + Number(p.amount), 0);
        const totalBilled = db.student.reduce((sum, s) => sum + Number(s.total_fee || 0), 0);
        const pending = Math.max(0, totalBilled - collected);

        // Course enrollments summary
        const courseCounts = db.course.map(c => {
          const count = db.enrollment.filter(e => e.course_id === c.course_id).length;
          return { name: c.course_name, count };
        });

        // Attendance health overall
        const totalAtt = db.attendance.length;
        const presentAtt = db.attendance.filter(a => a.status === "Present").length;
        const attRate = totalAtt > 0 ? ((presentAtt / totalAtt) * 100).toFixed(1) : "0.0";

        container.innerHTML = `
          <!-- Metric Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Total Students</p>
                <h3 class="text-3xl font-extrabold text-slate-800 mt-1">${totalStudents}</h3>
                <span class="text-xs text-indigo-600 font-medium mt-1 inline-block">Registered candidates</span>
              </div>
              <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-user-graduate"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Offered Courses</p>
                <h3 class="text-3xl font-extrabold text-slate-800 mt-1">${totalCourses}</h3>
                <span class="text-xs text-emerald-600 font-medium mt-1 inline-block">Across ${db.department.length} departments</span>
              </div>
              <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-book-open"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Fees Collected</p>
                <h3 class="text-3xl font-extrabold text-emerald-600 mt-1">₹${collected.toLocaleString('en-IN')}</h3>
                <span class="text-xs text-slate-500 font-medium mt-1 inline-block">${db.fee_payment.length} logged vouchers</span>
              </div>
              <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-circle-check"></i>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
              <div>
                <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Pending Dues</p>
                <h3 class="text-3xl font-extrabold text-amber-600 mt-1">₹${pending.toLocaleString('en-IN')}</h3>
                <span class="text-xs text-amber-600 font-medium mt-1 inline-block">Outstanding receivables</span>
              </div>
              <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </div>
            </div>
          </div>

          <!-- Secondary Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Course Enrollment Widget -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                  <i class="fa-solid fa-layer-group text-brand-600"></i> Course Enrollment Capacity
                </h3>
                <button onclick="setTab('courses')" class="text-xs text-brand-600 font-semibold hover:underline">Manage All</button>
              </div>
              <div class="space-y-4">
                ${courseCounts.map(c => `
                  <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                      <span class="text-slate-700">${c.name}</span>
                      <span class="text-slate-500">${c.count} students</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                      <div class="bg-brand-600 h-2.5 rounded-full" style="width: ${Math.min(100, (c.count / (totalStudents || 1)) * 100)}%"></div>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- Attendance Snapshot -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-slate-800 text-base mb-1 flex items-center gap-2">
                  <i class="fa-solid fa-chart-simple text-indigo-600"></i> Attendance Ratios
                </h3>
                <p class="text-xs text-slate-500 mb-6">Aggregated present status percentage</p>
                <div class="flex items-center justify-center py-4">
                  <div class="relative w-36 h-36 rounded-full flex items-center justify-center bg-indigo-50 border-8 border-indigo-500">
                    <div class="text-center">
                      <span class="text-3xl font-black text-indigo-700">${attRate}%</span>
                      <p class="text-[10px] uppercase font-bold text-slate-400">Present</p>
                    </div>
                  </div>
                </div>
              </div>
              <button onclick="setTab('attendance')" class="w-full mt-4 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold text-xs transition">
                Record Today's Class
              </button>
            </div>
          </div>
        `;
      }

      else if (currentTab === "students") {
        const deptMap = Object.fromEntries(db.department.map(d => [d.dept_id, d.dept_name]));

        container.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
              <h2 class="text-xl font-bold text-slate-800">Student Directory</h2>
              <p class="text-xs text-slate-500">Manage enrolled student rosters, departments, and course fees</p>
            </div>
            <button onclick="openAddStudentModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition flex items-center gap-2 self-start">
              <i class="fa-solid fa-user-plus"></i> Add New Student
            </button>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 border-b border-slate-100 text-xs font-semibold uppercase text-slate-500">
                  <tr>
                    <th class="py-3 px-4">Roll No</th>
                    <th class="py-3 px-4">Student Name</th>
                    <th class="py-3 px-4">Department</th>
                    <th class="py-3 px-4">Year</th>
                    <th class="py-3 px-4">Contact</th>
                    <th class="py-3 px-4">Total Fee</th>
                    <th class="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${db.student.length === 0 ? `
                    <tr><td colspan="7" class="py-8 text-center text-slate-400 font-medium">No students registered yet.</td></tr>
                  ` : db.student.map(s => `
                    <tr class="hover:bg-slate-50/70 transition">
                      <td class="py-3 px-4 font-mono font-semibold text-brand-600">${s.roll_no}</td>
                      <td class="py-3 px-4 font-semibold text-slate-800">${s.name}</td>
                      <td class="py-3 px-4">
                        <span class="inline-flex px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
                          ${deptMap[s.dept_id] || "General"}
                        </span>
                      </td>
                      <td class="py-3 px-4 text-slate-600">Year ${s.year}</td>
                      <td class="py-3 px-4 text-slate-500 text-xs">${s.email || "—"}</td>
                      <td class="py-3 px-4 font-mono font-medium">₹${Number(s.total_fee || 0).toLocaleString('en-IN')}</td>
                      <td class="py-3 px-4 text-right">
                        <button onclick="deleteStudent(${s.student_id})" class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg text-xs font-medium transition" title="Delete Student">
                          <i class="fa-solid fa-trash-can"></i>
                        </button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      else if (currentTab === "courses") {
        const deptMap = Object.fromEntries(db.department.map(d => [d.dept_id, d.dept_name]));

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Form: Add Course & Enroll -->
            <div class="space-y-6">
              <!-- Add Course -->
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 text-base mb-1 flex items-center gap-2">
                  <i class="fa-solid fa-plus-circle text-brand-600"></i> Create Course
                </h3>
                <p class="text-xs text-slate-500 mb-4">Add curriculum subject to a department</p>
                <form onsubmit="handleCreateCourse(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Course Name</label>
                    <input id="c-name" required placeholder="e.g. Operating Systems" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Credits</label>
                      <input id="c-credits" type="number" min="1" max="8" value="3" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                      <select id="c-dept" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                        ${db.department.map(d => `<option value="${d.dept_id}">${d.dept_name}</option>`).join("")}
                      </select>
                    </div>
                  </div>
                  <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-xl text-xs font-semibold transition mt-2">
                    Create Course
                  </button>
                </form>
              </div>

              <!-- Student Course Enrollment -->
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 text-base mb-1 flex items-center gap-2">
                  <i class="fa-solid fa-user-check text-emerald-600"></i> Course Enrollment
                </h3>
                <p class="text-xs text-slate-500 mb-4">Assign a student to a syllabus course</p>
                <form onsubmit="handleEnrollStudent(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Student</label>
                    <select id="e-student" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                      ${db.student.map(s => `<option value="${s.student_id}">${s.roll_no} - ${s.name}</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Course</label>
                    <select id="e-course" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                      ${db.course.map(c => `<option value="${c.course_id}">${c.course_name}</option>`).join("")}
                    </select>
                  </div>
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-semibold transition mt-2">
                    Enroll Student
                  </button>
                </form>
              </div>
            </div>

            <!-- Right: Courses List -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
              <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-slate-800 text-base">Offered Courses</h3>
                  <p class="text-xs text-slate-500">All registered subjects with enrollment counts</p>
                </div>
                <span class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full">
                  ${db.course.length} Active Courses
                </span>
              </div>
              <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-100 text-xs font-semibold uppercase text-slate-500">
                    <tr>
                      <th class="py-3 px-4">Course Name</th>
                      <th class="py-3 px-4">Department</th>
                      <th class="py-3 px-4 text-center">Credits</th>
                      <th class="py-3 px-4 text-center">Enrolled</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${db.course.map(c => {
                      const count = db.enrollment.filter(e => e.course_id === c.course_id).length;
                      return `
                        <tr class="hover:bg-slate-50/70 transition">
                          <td class="py-3 px-4 font-semibold text-slate-800">${c.course_name}</td>
                          <td class="py-3 px-4 text-xs text-slate-600">${deptMap[c.dept_id] || "—"}</td>
                          <td class="py-3 px-4 text-center font-mono font-medium text-slate-700">${c.credits}</td>
                          <td class="py-3 px-4 text-center">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-brand-50 text-brand-700">
                              ${count} students
                            </span>
                          </td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentTab === "attendance") {
        const studentMap = Object.fromEntries(db.student.map(s => [s.student_id, s.name]));
        const courseMap = Object.fromEntries(db.course.map(c => [c.course_id, c.course_name]));

        // Calculate attendance % per student per course
        const summary = {};
        db.attendance.forEach(a => {
          const key = `${a.student_id}_${a.course_id}`;
          if (!summary[key]) {
            summary[key] = {
              student_id: a.student_id,
              course_id: a.course_id,
              total: 0,
              present: 0
            };
          }
          summary[key].total += 1;
          if (a.status === "Present") summary[key].present += 1;
        });

        const summaryRows = Object.values(summary).map(s => {
          const pct = ((s.present / s.total) * 100).toFixed(1);
          return {
            studentName: studentMap[s.student_id] || "Unknown",
            courseName: courseMap[s.course_id] || "Unknown",
            total: s.total,
            present: s.present,
            percent: pct
          };
        });

        const today = new Date().toISOString().slice(0, 10);

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Mark Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
              <h3 class="font-bold text-slate-800 text-base mb-1 flex items-center gap-2">
                <i class="fa-solid fa-clipboard-check text-brand-600"></i> Mark Attendance
              </h3>
              <p class="text-xs text-slate-500 mb-4">Record student daily attendance status</p>
              <form onsubmit="handleMarkAttendance(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Student</label>
                  <select id="att-student" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                    ${db.student.map(s => `<option value="${s.student_id}">${s.roll_no} - ${s.name}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Course</label>
                  <select id="att-course" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                    ${db.course.map(c => `<option value="${c.course_id}">${c.course_name}</option>`).join("")}
                  </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
                    <input id="att-date" type="date" value="${today}" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
                    <select id="att-status" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                      <option value="Present">Present</option>
                      <option value="Absent">Absent</option>
                      <option value="Late">Late</option>
                    </select>
                  </div>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-xl text-xs font-semibold transition mt-2">
                  Submit Attendance
                </button>
              </form>
            </div>

            <!-- Summary Table -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
              <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-slate-800 text-base">Attendance Percentages</h3>
                  <p class="text-xs text-slate-500">Calculated ratios grouped by student and registered course</p>
                </div>
                <span class="text-xs text-slate-400 font-mono">${db.attendance.length} total entries</span>
              </div>
              <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-100 text-xs font-semibold uppercase text-slate-500">
                    <tr>
                      <th class="py-3 px-4">Student</th>
                      <th class="py-3 px-4">Course</th>
                      <th class="py-3 px-4 text-center">Sessions</th>
                      <th class="py-3 px-4 text-center">Present</th>
                      <th class="py-3 px-4 text-right">Attendance %</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${summaryRows.length === 0 ? `
                      <tr><td colspan="5" class="py-8 text-center text-slate-400">No attendance entries recorded.</td></tr>
                    ` : summaryRows.map(r => `
                      <tr class="hover:bg-slate-50/70 transition">
                        <td class="py-3 px-4 font-semibold text-slate-800">${r.studentName}</td>
                        <td class="py-3 px-4 text-slate-600 text-xs">${r.courseName}</td>
                        <td class="py-3 px-4 text-center font-mono text-xs text-slate-500">${r.total}</td>
                        <td class="py-3 px-4 text-center font-mono text-xs font-semibold text-emerald-600">${r.present}</td>
                        <td class="py-3 px-4 text-right font-mono font-bold ${Number(r.percent) >= 75 ? 'text-emerald-600' : 'text-rose-500'}">
                          ${r.percent}%
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentTab === "fees") {
        const studentMap = Object.fromEntries(db.student.map(s => [s.student_id, s]));

        // Calculate paid and pending per student
        const feeLedger = db.student.map(s => {
          const payments = db.fee_payment.filter(p => p.student_id === s.student_id);
          const paid = payments.reduce((acc, p) => acc + Number(p.amount), 0);
          const total = Number(s.total_fee || 0);
          const pending = Math.max(0, total - paid);
          return {
            student_id: s.student_id,
            roll_no: s.roll_no,
            name: s.name,
            total,
            paid,
            pending
          };
        });

        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Record Fee Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
              <h3 class="font-bold text-slate-800 text-base mb-1 flex items-center gap-2">
                <i class="fa-solid fa-indian-rupee-sign text-emerald-600"></i> Record Payment
              </h3>
              <p class="text-xs text-slate-500 mb-4">Post voucher against student ledger</p>
              <form onsubmit="handleFeePayment(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Student</label>
                  <select id="fee-student" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                    ${db.student.map(s => `<option value="${s.student_id}">${s.roll_no} - ${s.name}</option>`).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Payment Amount (₹)</label>
                  <input id="fee-amount" type="number" step="100" min="1" required placeholder="e.g. 15000" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-semibold transition mt-2">
                  Confirm Payment
                </button>
              </form>
            </div>

            <!-- Ledger Table -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
              <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-slate-800 text-base">Fee Balance Ledger</h3>
                  <p class="text-xs text-slate-500">Live reconciliation of student accounts</p>
                </div>
              </div>
              <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-100 text-xs font-semibold uppercase text-slate-500">
                    <tr>
                      <th class="py-3 px-4">Roll</th>
                      <th class="py-3 px-4">Student</th>
                      <th class="py-3 px-4 text-right">Total Obligation</th>
                      <th class="py-3 px-4 text-right">Paid</th>
                      <th class="py-3 px-4 text-right">Pending Due</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${feeLedger.map(f => `
                      <tr class="hover:bg-slate-50/70 transition">
                        <td class="py-3 px-4 font-mono font-semibold text-brand-600">${f.roll_no}</td>
                        <td class="py-3 px-4 font-semibold text-slate-800">${f.name}</td>
                        <td class="py-3 px-4 text-right font-mono text-slate-600">₹${f.total.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 text-right font-mono text-emerald-600 font-semibold">₹${f.paid.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 text-right font-mono font-bold ${f.pending > 0 ? 'text-amber-600' : 'text-slate-400'}">
                          ₹${f.pending.toLocaleString('en-IN')}
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      else if (currentTab === "raw-db") {
        container.innerHTML = `
          <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-slate-800">Database Inspector (Raw Tables)</h2>
              <p class="text-xs text-slate-500">Real-time inspection of client-side relational storage</p>
            </div>
            <button onclick="copyDbJson()" class="self-start text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
              <i class="fa-regular fa-copy"></i> Copy Database JSON
            </button>
          </div>

          <div class="space-y-6">
            ${Object.entries(db).map(([tableName, rows]) => `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="bg-slate-50 px-5 py-3 border-b border-slate-100 flex items-center justify-between">
                  <span class="font-bold text-slate-700 text-sm font-mono flex items-center gap-2">
                    <i class="fa-solid fa-table text-brand-600"></i> ${tableName}
                  </span>
                  <span class="text-xs text-slate-400 font-mono">${rows.length} row(s)</span>
                </div>
                <div class="overflow-x-auto">
                  ${rows.length === 0 ? `
                    <div class="p-4 text-center text-xs text-slate-400 font-medium">Table empty</div>
                  ` : `
                    <table class="w-full text-left text-xs">
                      <thead class="bg-slate-50/50 border-b border-slate-100 font-mono text-slate-500 uppercase">
                        <tr>
                          ${Object.keys(rows[0]).map(col => `<th class="py-2.5 px-4">${col}</th>`).join("")}
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100 font-mono">
                        ${rows.map(r => `
                          <tr class="hover:bg-slate-50 transition">
                            ${Object.values(r).map(v => `<td class="py-2.5 px-4 text-slate-700">${v !== null ? v : "null"}</td>`).join("")}
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  `}
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    // -------------------------------------------------------------
    // Action Handlers
    // -------------------------------------------------------------
    function openAddStudentModal() {
      const db = DB.get();
      const modalTitle = document.getElementById("modal-title");
      const modalBody = document.getElementById("modal-body");

      modalTitle.innerText = "Register New Student";
      modalBody.innerHTML = `
        <form onsubmit="handleCreateStudent(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Roll Number *</label>
              <input id="modal-roll" required placeholder="e.g. CS104" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Academic Year</label>
              <select id="modal-year" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name *</label>
            <input id="modal-name" required placeholder="e.g. Sneha Roy" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
            <input id="modal-email" type="email" placeholder="sneha@college.edu" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
              <select id="modal-dept" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                ${db.department.map(d => `<option value="${d.dept_id}">${d.dept_name}</option>`).join("")}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Total Course Fee (₹)</label>
              <input id="modal-fee" type="number" step="500" value="60000" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl transition">
              Save Student
            </button>
          </div>
        </form>
      `;

      document.getElementById("modal-backdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal-backdrop").classList.add("hidden");
    }

    function handleCreateStudent(e) {
      e.preventDefault();
      const db = DB.get();

      const roll_no = document.getElementById("modal-roll").value.trim();
      const name = document.getElementById("modal-name").value.trim();
      const email = document.getElementById("modal-email").value.trim();
      const year = Number(document.getElementById("modal-year").value);
      const dept_id = Number(document.getElementById("modal-dept").value);
      const total_fee = Number(document.getElementById("modal-fee").value) || 0;

      // Uniqueness check for Roll No
      if (db.student.some(s => s.roll_no.toLowerCase() === roll_no.toLowerCase())) {
        showToast(`Roll number "${roll_no}" already exists!`, true);
        return;
      }

      const newStudent = {
        student_id: DB.nextId("student", "student_id"),
        roll_no,
        name,
        email,
        year,
        total_fee,
        dept_id
      };

      db.student.push(newStudent);
      DB.save(db);
      closeModal();
      showToast(`Student ${name} registered successfully!`);
      renderContent();
    }

    function deleteStudent(studentId) {
      const db = DB.get();
      const student = db.student.find(s => s.student_id === studentId);
      if (!student) return;

      if (confirm(`Delete student "${student.name}"? This cascades to all related enrollments, attendance, and fee payments.`)) {
        // Enforce Cascade Delete
        db.student = db.student.filter(s => s.student_id !== studentId);
        db.enrollment = db.enrollment.filter(e => e.student_id !== studentId);
        db.attendance = db.attendance.filter(a => a.student_id !== studentId);
        db.fee_payment = db.fee_payment.filter(f => f.student_id !== studentId);

        DB.save(db);
        showToast("Student and cascaded records deleted.");
        renderContent();
      }
    }

    function handleCreateCourse(e) {
      e.preventDefault();
      const db = DB.get();
      const course_name = document.getElementById("c-name").value.trim();
      const credits = Number(document.getElementById("c-credits").value) || 3;
      const dept_id = Number(document.getElementById("c-dept").value);

      if (!course_name) return;

      const newCourse = {
        course_id: DB.nextId("course", "course_id"),
        course_name,
        credits,
        dept_id
      };

      db.course.push(newCourse);
      DB.save(db);
      showToast(`Course "${course_name}" created.`);
      renderContent();
    }

    function handleEnrollStudent(e) {
      e.preventDefault();
      const db = DB.get();
      const student_id = Number(document.getElementById("e-student").value);
      const course_id = Number(document.getElementById("e-course").value);

      // Check unique (student_id, course_id)
      const exists = db.enrollment.some(e => e.student_id === student_id && e.course_id === course_id);
      if (exists) {
        showToast("Student is already enrolled in this course!", true);
        return;
      }

      db.enrollment.push({ student_id, course_id });
      DB.save(db);
      showToast("Student successfully enrolled!");
      renderContent();
    }

    function handleMarkAttendance(e) {
      e.preventDefault();
      const db = DB.get();
      const student_id = Number(document.getElementById("att-student").value);
      const course_id = Number(document.getElementById("att-course").value);
      const att_date = document.getElementById("att-date").value;
      const status = document.getElementById("att-status").value;

      if (!att_date) {
        showToast("Please choose an attendance date.", true);
        return;
      }

      // SQLite UPSERT logic: ON CONFLICT(student_id, course_id, att_date) DO UPDATE
      const existingIdx = db.attendance.findIndex(a => 
        a.student_id === student_id && a.course_id === course_id && a.att_date === att_date
      );

      if (existingIdx !== -1) {
        db.attendance[existingIdx].status = status;
        showToast("Existing attendance record updated!");
      } else {
        db.attendance.push({
          att_id: DB.nextId("attendance", "att_id"),
          student_id,
          course_id,
          att_date,
          status
        });
        showToast("Attendance logged!");
      }

      DB.save(db);
      renderContent();
    }

    function handleFeePayment(e) {
      e.preventDefault();
      const db = DB.get();
      const student_id = Number(document.getElementById("fee-student").value);
      const amount = Number(document.getElementById("fee-amount").value);

      if (!amount || amount <= 0) {
        showToast("Please provide a valid positive amount.", true);
        return;
      }

      const newPayment = {
        pay_id: DB.nextId("fee_payment", "pay_id"),
        student_id,
        amount,
        paid_on: new Date().toISOString().slice(0, 10)
      };

      db.fee_payment.push(newPayment);
      DB.save(db);
      showToast(`Payment of ₹${amount.toLocaleString('en-IN')} logged!`);
      renderContent();
    }

    function copyDbJson() {
      const db = DB.get();
      const jsonStr = JSON.stringify(db, null, 2);
      const el = document.createElement("textarea");
      el.value = jsonStr;
      document.body.appendChild(el);
      el.select();
      document.execCommand("copy");
      document.body.removeChild(el);
      showToast("Database JSON copied to clipboard!");
    }

    // -------------------------------------------------------------
    // Bootstrapping
    // -------------------------------------------------------------
    window.onload = function() {
      renderNav();
      renderContent();
    };
  </script>
</body>
</html>
